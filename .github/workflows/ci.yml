name: CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Explicit Node majors, never 'latest'. A brand-new Node release must not be
  # able to turn master red on its own -- see the canary job below for early warning.
  #
  # The floor is 22 because package.json "engines.node" is >=22.19.0: the modern
  # @salesforce/core chain pulls undici, which requires it. setup-node with '22'
  # resolves the latest 22.x, which satisfies that. 24 is the active LTS line and
  # 26 is Current (LTS from 2026-10-28). 18 and 20 were dropped when the plugin
  # moved to ESM and the current sf-plugins-core.
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24', '26']
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: yarn

      # --frozen-lockfile so an out-of-sync yarn.lock fails the build instead of
      # being silently re-resolved.
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Runs mocha, then eslint via the "posttest" lifecycle script.
      - name: Run tests
        run: yarn test

  # The single required status check for master.
  #
  # Branch protection requires this job and nothing else, so the matrix above can gain
  # or drop Node versions without anyone editing repo settings. That coupling is what
  # broke before: renaming the jobs left two dead contexts ("node-latest",
  # "node-latest-windows") still required, and every PR sat waiting forever on a status
  # that nothing would ever report.
  #
  # Deliberately does not depend on the canary job -- that one is advisory, and gating
  # merges on it would hand a brand-new Node release the power to block every PR.
  ci-gate:
    name: ci-gate
    needs: [test]
    # always() so the gate still runs (and reports a status) when a matrix job fails,
    # is cancelled, or is skipped. Without it the gate would itself be skipped and
    # report nothing, leaving the PR stuck in exactly the state described above.
    if: always()
    runs-on: ubuntu-latest
    steps:
      # needs.test.result aggregates the whole matrix: "success" only if every leg
      # succeeded, otherwise failure / cancelled / skipped.
      - name: Require every matrix job to have succeeded
        run: |
          echo "test matrix result: ${{ needs.test.result }}"
          [ "${{ needs.test.result }}" = "success" ]

  # Early warning for the next Node major. Advisory only: never blocks a merge.
  canary-node-latest:
    name: canary (node latest, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: latest
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests
        run: yarn test
