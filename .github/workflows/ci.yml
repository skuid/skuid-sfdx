name: CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Explicit Node majors, never 'latest'. A brand-new Node release must not be
  # able to turn master red on its own -- see the canary job below for early warning.
  #
  # The floor is 22 because package.json "engines.node" is >=22.19.0: the modern
  # @salesforce/core chain pulls undici, which requires it. setup-node with '22'
  # resolves the latest 22.x, which satisfies that. 24 is the active LTS line and
  # 26 is Current (LTS from 2026-10-28). 18 and 20 were dropped when the plugin
  # moved to ESM and the current sf-plugins-core.
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24', '26']
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: yarn

      # --frozen-lockfile so an out-of-sync yarn.lock fails the build instead of
      # being silently re-resolved.
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Runs mocha, then eslint via the "posttest" lifecycle script.
      - name: Run tests
        run: yarn test

  # Checks the matrix above structurally cannot perform, because each needs a
  # clean dependency resolution, the packed artifact, or the generated command
  # manifest -- none of which `yarn test` exercises. Every one of these
  # corresponds to a bug that actually shipped from this repo.
  #
  # Runs once on Linux; the logic is OS-independent.
  harden:
    name: harden
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Produces lib/ and oclif.manifest.json, which the checks below read.
      - name: Build
        run: yarn prepack

      # Every bare import in src/ and test/ must be declared in package.json.
      # `glob` was imported but never declared, and shipped broken to every
      # consumer whose install hoisted glob 9+ (#29).
      - name: Undeclared imports
        run: node scripts/check-imports.mjs

      # The README's flag tables must match the manifest. It documented a
      # --loglevel flag that no longer exists and spelled --api-version wrong.
      - name: README matches the command manifest
        run: node scripts/check-readme-flags.mjs

      # Pack, install with only the declared production dependencies somewhere
      # clean, and import every command from the packed output. This is the
      # check that would have caught #29 before release: the suite passed while
      # the published plugin was broken, because tests run against the repo's
      # own node_modules and never against a fresh resolution.
      - name: Packed artifact installs and loads standalone
        run: node scripts/check-artifact.mjs

      # Advisory, not blocking. The script still fails on high/critical advisories
      # in dependencies that ship, so the finding is loud in the log and shows as
      # a failed step -- but continue-on-error keeps it from failing the job, and
      # therefore from blocking a merge.
      #
      # The reason is that advisories arrive from outside on their own schedule: a
      # new CVE in a transitive dependency can turn every PR red with no change to
      # the code, and as AB#545957 found, such advisories are frequently unfixable
      # in place because a parent caps the version. Master already stayed red for
      # months that way before AB#545952. Nobody should be unable to merge a
      # typo fix because someone else's package got an advisory overnight.
      #
      # Everything else in this job is deterministic and stays blocking.
      - name: Dependency advisories (advisory only -- see comment)
        continue-on-error: true
        run: node scripts/check-audit.mjs

  # The single required status check for master.
  #
  # Branch protection requires this job and nothing else, so the matrix above can gain
  # or drop Node versions without anyone editing repo settings. That coupling is what
  # broke before: renaming the jobs left two dead contexts ("node-latest",
  # "node-latest-windows") still required, and every PR sat waiting forever on a status
  # that nothing would ever report.
  #
  # Deliberately does not depend on the canary job -- that one is advisory, and gating
  # merges on it would hand a brand-new Node release the power to block every PR.
  ci-gate:
    name: ci-gate
    needs: [test, harden]
    # always() so the gate still runs (and reports a status) when a matrix job fails,
    # is cancelled, or is skipped. Without it the gate would itself be skipped and
    # report nothing, leaving the PR stuck in exactly the state described above.
    if: always()
    runs-on: ubuntu-latest
    steps:
      # needs.test.result aggregates the whole matrix: "success" only if every leg
      # succeeded, otherwise failure / cancelled / skipped.
      - name: Require the matrix and the hardening checks to have succeeded
        run: |
          echo "test matrix result: ${{ needs.test.result }}"
          echo "harden result:      ${{ needs.harden.result }}"
          [ "${{ needs.test.result }}" = "success" ] && [ "${{ needs.harden.result }}" = "success" ]

  # Early warning for the next Node major. Advisory only: never blocks a merge.
  canary-node-latest:
    name: canary (node latest, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: latest
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests
        run: yarn test
