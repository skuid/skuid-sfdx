name: CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Explicit Node majors, never 'latest'. A brand-new Node release must not be
  # able to turn master red on its own -- see the canary job below for early warning.
  #
  # 18 is the floor declared by package.json "engines.node".
  # 22 and 24 are the active LTS lines; 26 is Current (LTS from 2026-10-28).
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['18', '22', '24', '26']
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: yarn

      # --frozen-lockfile so an out-of-sync yarn.lock fails the build instead of
      # being silently re-resolved.
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Runs mocha, then eslint via the "posttest" lifecycle script.
      - name: Run tests
        run: yarn test

  # Early warning for the next Node major. Advisory only: never blocks a merge.
  canary-node-latest:
    name: canary (node latest, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: latest
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests
        run: yarn test
